services:
  frontend:
    image: oven/bun:1
    working_dir: /app
    command: sh -c "bun install --frozen-lockfile && bun run dev --hostname 0.0.0.0"
    ports:
      - "3001:3001"
    volumes:
      - ./mimi-front:/app
      - frontend_node_modules:/app/node_modules
    environment:
      NEXT_PUBLIC_BACKEND_URL: http://localhost:3000
    depends_on:
      - backend

  backend:
    image: oven/bun:1
    working_dir: /app
    command: sh -c "bun install --frozen-lockfile && bun run start:dev"
    ports:
      - "3000:3000"
    volumes:
      - ./mimi-backend:/app
      - backend_node_modules:/app/node_modules
    environment:
      PORT: 3000
      DATABASE_URL: postgres://mimi:mimi@postgres:5432/mimi
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_S3_BUCKET: mimi-images
      AWS_ENDPOINT_URL: http://minio:9000
      AWS_PUBLIC_URL: http://localhost:9000
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mimi
      POSTGRES_PASSWORD: mimi
      POSTGRES_DB: mimi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mimi -d mimi"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: /bin/sh
    command:
      - -c
      - until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done && mc mb --ignore-existing local/mimi-images && mc anonymous set download local/mimi-images

volumes:
  backend_node_modules:
  frontend_node_modules:
  postgres_data:
  minio_data:
