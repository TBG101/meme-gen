services:
  frontend:
    image: oven/bun:1
    working_dir: /app
    command: sh -c "bun install --frozen-lockfile && bun run dev --hostname 0.0.0.0"
    ports:
      - "3001:3001"
    volumes:
      - ./mimi-front:/app
      - frontend_node_modules:/app/node_modules
    environment:
      NEXT_PUBLIC_BACKEND_URL: http://localhost:3000
    depends_on:
      - backend

  backend:
    image: oven/bun:1
    working_dir: /app
    command: sh -c "bun install --frozen-lockfile && bun run start:dev"
    ports:
      - "3000:3000"
    volumes:
      - ./mimi-backend:/app
      - backend_node_modules:/app/node_modules
    environment:
      PORT: 3000
      DATABASE_URL: postgres://mimi:mimi@postgres:5432/mimi
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: mimi-local-access
      AWS_SECRET_ACCESS_KEY: mimi-local-secret
      AWS_S3_BUCKET: mimi-images
      AWS_ENDPOINT_URL: http://rustfs:9000
      AWS_PUBLIC_URL: http://localhost:9000
    depends_on:
      postgres:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mimi
      POSTGRES_PASSWORD: mimi
      POSTGRES_DB: mimi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mimi -d mimi"]
      interval: 5s
      timeout: 5s
      retries: 10

  rustfs:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: mimi-local-access
      RUSTFS_SECRET_KEY: mimi-local-secret
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    command: ["/data"]
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs_data:/data

  rustfs-init:
    image: amazon/aws-cli:latest
    depends_on:
      - rustfs
    environment:
      AWS_ACCESS_KEY_ID: mimi-local-access
      AWS_SECRET_ACCESS_KEY: mimi-local-secret
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until aws --endpoint-url http://rustfs:9000 s3api list-buckets >/dev/null 2>&1; do sleep 1; done;
        if ! aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket mimi-images >/dev/null 2>&1; then
        aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket mimi-images;
        fi;
        aws --endpoint-url http://rustfs:9000 s3api put-bucket-policy --bucket mimi-images --policy
        '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":"*","Action":"s3:GetObject","Resource":"arn:aws:s3:::mimi-images/*"}]}'

volumes:
  backend_node_modules:
  frontend_node_modules:
  postgres_data:
  rustfs_data:
